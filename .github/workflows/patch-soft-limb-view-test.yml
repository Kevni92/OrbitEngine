name: Update soft-limb shader test
on:
  push:
    branches: [fix/244-atmosphere-radiance]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/244-atmosphere-radiance
          fetch-depth: 0
      - name: Update obsolete shader assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/orbit-engine-three/tests/view.test.mjs')
          text = path.read_text()
          old = '  assert.match(atmosphereShader, /float displayGain = bodyIntersectsView/);\n  assert.doesNotMatch(atmosphereShader, /bodyIntersectsView\\s*\\?\\s*0\\.0/);'
          new = '  assert.match(atmosphereShader, /const float SURFACE_DISPLAY_GAIN/);\n  assert.match(atmosphereShader, /float tangentCompression = inversesqrt/);\n  assert.match(atmosphereShader, /float displayGain = mix\\(DISPLAY_GAIN, SURFACE_DISPLAY_GAIN, surfaceCompositeBlend\\)/);\n  assert.doesNotMatch(atmosphereShader, /bodyIntersectsView\\s*\\?\\s*0\\.0/);'
          if old not in text:
              raise SystemExit('obsolete shader assertion anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit test update
        shell: bash
        run: |
          git rm .github/workflows/patch-soft-limb-view-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/orbit-engine-three/tests/view.test.mjs
          git commit -m 'test: assert continuous atmosphere limb presentation'
          git push origin HEAD:fix/244-atmosphere-radiance
