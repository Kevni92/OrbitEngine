name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PNPM_VERSION: 11.4.0
  EMSCRIPTEN_VERSION: 3.1.74

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm test:ts

  portable-cpp:
    name: Portable C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 is the deliberate glibc release baseline (glibc 2.35).
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:core
      - run: pnpm test:cpp

  native:
    name: Native (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm build:native
      - run: pnpm test:native
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: native-${{ matrix.os }}-${{ matrix.node }}
          path: packages/orbit-engine/prebuilds
          if-no-files-found: error

  wasm:
    name: WASM (Node ${{ matrix.node }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm build:wasm
      - run: pnpm test:wasm

  browser-wasm-smoke:
    name: Browser WASM consumer smoke
    runs-on: ubuntu-22.04
    needs: [wasm]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm build:wasm
      - run: pnpm browser:build
      - run: pnpm --filter orbit-engine-browser-smoke exec playwright install --with-deps chromium
      - run: pnpm browser:smoke

  parity:
    name: Backend parity (Node ${{ matrix.node }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm build:native
      - run: pnpm build:wasm
      - run: pnpm test:parity

  package-assembly:
    name: Package assembly and tarball smoke
    runs-on: ubuntu-22.04
    needs: [native]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: packages/orbit-engine/prebuilds
          merge-multiple: true
      - run: pnpm build:ts
      - run: pnpm build:wasm
      - run: pnpm package:smoke
        env:
          ORBIT_ENGINE_SMOKE_REQUIRE_ALL: "true"
