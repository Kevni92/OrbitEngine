name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PNPM_VERSION: 11.4.0
  EMSCRIPTEN_VERSION: 3.1.74

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm build:three
      - run: pnpm test:ts
      - run: pnpm test:three

  oep-importer:
    name: OEP importer + CSPICE oracle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/oep-importer/requirements-spice.txt
      - run: python -m pip install -r tools/oep-importer/requirements-spice.txt
      - run: pnpm test:oep-importer
      - run: pnpm test:oep-importer:spice

  portable-cpp:
    name: Portable C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 is the deliberate glibc release baseline (glibc 2.35).
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:core
      - run: pnpm test:cpp

  native:
    name: Native (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm build:native
      - run: pnpm test:native
      - run: pnpm test:oep-importer:runtime:native
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: native-${{ matrix.os }}-${{ matrix.node }}
          path: packages/orbit-engine/prebuilds
          if-no-files-found: error

  wasm:
    name: WASM (Node ${{ matrix.node }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm build:wasm
      - run: pnpm test:wasm
      - run: pnpm test:oep-importer:runtime:wasm

  browser-wasm-smoke:
    name: Browser WASM consumer smoke
    runs-on: ubuntu-22.04
    needs: [wasm]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm build:wasm
      - run: pnpm browser:build
      - run: pnpm --filter orbit-engine-browser-smoke exec playwright install --with-deps chromium
      - run: pnpm browser:smoke
      - run: pnpm demo:build
      - run: pnpm demo:test
      # The production OEP browser regression is the CI gate. The complete
      # visual suite remains part of the local demo validation; running all
      # 15 large-dataset pages here exhausts the hosted runner over time.
      - run: pnpm --filter orbit-engine-solar-system-demo exec playwright test tests/production-oep.smoke.spec.ts

  three-package:
    name: orbit-engine-three package and peer smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm build:three
      - run: pnpm test:three
      - run: pnpm package:three-smoke

  three-browser-smoke:
    name: orbit-engine-three browser consumer smoke
    runs-on: ubuntu-22.04
    needs: [three-package]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm build:three
      - run: pnpm --filter orbit-engine-three-browser-smoke typecheck
      - run: pnpm --filter orbit-engine-three-browser-smoke build
      - run: pnpm --filter orbit-engine-three-browser-smoke exec playwright install --with-deps chromium
      - run: pnpm --filter orbit-engine-three-browser-smoke smoke
      - run: pnpm three:browser:packaged

  parity:
    name: Backend parity (Node ${{ matrix.node }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm build:native
      - run: pnpm build:wasm
      - run: pnpm test:parity

  package-assembly:
    name: Package assembly and tarball smoke
    runs-on: ubuntu-22.04
    needs: [native]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: packages/orbit-engine/prebuilds
          merge-multiple: true
      - run: pnpm build:ts
      - run: pnpm build:wasm
      - run: pnpm package:smoke
        env:
          ORBIT_ENGINE_SMOKE_REQUIRE_ALL: "true"
