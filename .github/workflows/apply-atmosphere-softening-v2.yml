name: Apply atmosphere softening v2
on:
  push:
    branches: [fix/244-atmosphere-radiance]
permissions:
  contents: write
env:
  PNPM_VERSION: 11.4.0
jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/244-atmosphere-radiance
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply soft limb patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          text = Path('.github/workflows/apply-atmosphere-softening.yml').read_text()
          encoded = None
          for line in text.splitlines():
              marker = "          echo '"
              suffix = "' | base64 -d > /tmp/apply-softening.py"
              if line.startswith(marker) and line.endswith(suffix):
                  encoded = line[len(marker):-len(suffix)]
                  break
          if encoded is None:
              raise SystemExit('embedded softening patch not found')
          Path('/tmp/apply-softening.py').write_bytes(base64.b64decode(encoded))
          PY
          python /tmp/apply-softening.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm --filter orbit-engine-three test
      - run: git diff --check
      - name: Commit validated patch
        shell: bash
        run: |
          git rm .github/workflows/apply-atmosphere-softening.yml .github/workflows/apply-atmosphere-softening-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/orbit-engine-three/src/view.ts packages/orbit-engine-three/src/presentation/atmosphere-math.ts packages/orbit-engine-three/tests/atmosphere-math.test.mjs docs/19-celestial-appearance-atmospheres-and-lighting.md
          git commit -m 'fix: soften atmosphere limb transition'
          git push origin HEAD:fix/244-atmosphere-radiance
