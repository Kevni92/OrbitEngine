name: Apply corrected atmosphere soft limb
on:
  push:
    branches: [fix/244-atmosphere-radiance]
permissions:
  contents: write
env:
  PNPM_VERSION: 11.4.0
jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/244-atmosphere-radiance
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@v14
      - name: Apply actual limb correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          math_path = "packages/orbit-engine-three/src/presentation/atmosphere-math.ts"
          replace_once(
              math_path,
              "export const ATMOSPHERE_OUTER_FADE_START_SHELL_FRACTION = 0.35;\nexport const ATMOSPHERE_SURFACE_BLEND_INNER_SHELL_WIDTHS = -1.5;\nexport const ATMOSPHERE_SURFACE_BLEND_OUTER_SHELL_WIDTHS = 0.1;",
              "export const ATMOSPHERE_OUTER_FADE_START_SHELL_FRACTION = 0.15;\nexport const ATMOSPHERE_SURFACE_BLEND_INNER_SHELL_WIDTHS = -0.5;\nexport const ATMOSPHERE_SURFACE_BLEND_OUTER_SHELL_WIDTHS = 0.8;",
          )
          replace_once(
              math_path,
              "  if (!bodyIntersectsView) return 0;\n  const width = ATMOSPHERE_SURFACE_BLEND_OUTER_SHELL_WIDTHS - ATMOSPHERE_SURFACE_BLEND_INNER_SHELL_WIDTHS;",
              "  // Let the presentation gain cross the physical silhouette instead of\n  // ending at it. A negative distance without a body hit is invalid input.\n  if (!bodyIntersectsView && signedLimbShellWidths < 0) return 0;\n  const width = ATMOSPHERE_SURFACE_BLEND_OUTER_SHELL_WIDTHS - ATMOSPHERE_SURFACE_BLEND_INNER_SHELL_WIDTHS;",
          )

          view_path = Path("packages/orbit-engine-three/src/view.ts")
          view = view_path.read_text()
          old_constants = "const float DISPLAY_GAIN = ${ATMOSPHERE_SCATTERING_DISPLAY_GAIN.toFixed(2)};\nconst float LIMB_DISPLAY_GAIN = 1.25;"
          new_constants = "const float DISPLAY_GAIN = ${ATMOSPHERE_SCATTERING_DISPLAY_GAIN.toFixed(2)};\nconst float SURFACE_DISPLAY_GAIN = ${ATMOSPHERE_SURFACE_COMPOSITE_DISPLAY_GAIN.toFixed(2)};\nconst float LIMB_DISPLAY_GAIN = 1.25;"
          if old_constants not in view:
              raise SystemExit("shader constant anchor not found")
          view = view.replace(old_constants, new_constants, 1)
          old_blend = "  float surfaceCompositeBlend = bodyIntersectsView\n    ? 1.0 - smoothstep(SURFACE_BLEND_INNER, SURFACE_BLEND_OUTER, signedLimbShellWidths)\n    : 0.0;"
          new_blend = "  float surfaceCompositeBlend = 1.0 - smoothstep(SURFACE_BLEND_INNER, SURFACE_BLEND_OUTER, signedLimbShellWidths);"
          if old_blend not in view:
              raise SystemExit("surface blend anchor not found")
          view = view.replace(old_blend, new_blend, 1)
          start = view.index("  // A body hit only limits the integrated path to the front shell. Its\n", view.index("float outerFade"))
          end_marker = "  vec3 radiance = integratedScattering * displayGain * limbGain;"
          end = view.index(end_marker, start) + len(end_marker)
          replacement = "\n".join([
              "  // A body hit only limits the integrated path to the front shell. Its",
              "  // atmosphere remains visible over the already-rendered opaque surface.",
              "  float alpha = clamp(1.0 - exp(-viewOpticalDepth), 0.0, 0.94) * outerFade;",
              "",
              "  // Tangent paths are physically bright, but multiplying that peak with a",
              "  // large shell gain creates a narrow wire ring. Compress presentation",
              "  // amplitude only; the integrated RGB transport remains unchanged.",
              "  float longPathExcess = max(densityPath - 1.0, 0.0);",
              "  float tangentCompression = inversesqrt(1.0 + 0.30 * longPathExcess * longPathExcess);",
              "  float limbGain = mix(1.0, LIMB_DISPLAY_GAIN, smoothstep(1.0, 4.0, densityPath));",
              "",
              "  // Cross-fade disk and shell gains across both sides of the silhouette so",
              "  // atmosphere grows continuously out of the planet instead of starting as",
              "  // a separately visible circular outline.",
              "  float displayGain = mix(DISPLAY_GAIN, SURFACE_DISPLAY_GAIN, surfaceCompositeBlend);",
              "  vec3 radiance = integratedScattering * displayGain * limbGain * tangentCompression;",
          ])
          view = view[:start] + replacement + view[end:]
          view_path.write_text(view)

          shell_path = Path("apps/solar-system-demo/src/rendering/three-shell.ts")
          lines = shell_path.read_text().splitlines()
          match = next((i for i, line in enumerate(lines) if "float displayGain = bodyIntersectsView" in line and "DISPLAY_GAIN" in line), None)
          if match is None:
              raise SystemExit("runtime presentation patch anchor not found")
          lines[match - 1:match + 3] = [
              "    .replace(",
              "      /const float SURFACE_DISPLAY_GAIN = [-+0-9.eE]+;/,",
              "      `const float SURFACE_DISPLAY_GAIN = ${tuning.atmosphereSurfaceCompositeGain.toFixed(4)};`,",
              "    );",
          ]
          shell_path.write_text("\n".join(lines) + "\n")

          tuning_path = Path("apps/solar-system-demo/src/ui/lighting-inspector.ts")
          tuning = tuning_path.read_text()
          changes = {
              "  atmosphereShellDisplayGain: 3.5,": "  atmosphereShellDisplayGain: 1.8,",
              "  atmosphereSurfaceCompositeGain: 0.38,": "  atmosphereSurfaceCompositeGain: 0.55,",
              "  atmosphereLimbGain: 1.25,": "  atmosphereLimbGain: 1,",
              "  bloomStrength: 0.28,": "  bloomStrength: 0.38,",
              "  bloomRadius: 0.85,": "  bloomRadius: 0.95,",
              "  bloomCompositeGain: 0.75,": "  bloomCompositeGain: 0.9,",
              'const STORAGE_KEY = "orbit-engine-demo-lighting-inspector-v2";': 'const STORAGE_KEY = "orbit-engine-demo-lighting-inspector-v3";',
          }
          for old, new in changes.items():
              if old not in tuning:
                  raise SystemExit(f"tuning anchor not found: {old}")
              tuning = tuning.replace(old, new, 1)
          tuning_path.write_text(tuning)

          test_path = Path("packages/orbit-engine-three/tests/atmosphere-math.test.mjs")
          tests = test_path.read_text()
          start = tests.index('test("presentation shell fades continuously to zero before the finite mesh edge"')
          replacement_tests = "\n".join([
              'test("presentation shell fades continuously to zero before the finite mesh edge", () => {',
              '  assert.equal(atmosphereOuterShellFade(-0.5), 1);',
              '  assert.equal(atmosphereOuterShellFade(0), 1);',
              '  assert.equal(atmosphereOuterShellFade(0.15), 1);',
              '  const middle = atmosphereOuterShellFade(0.55);',
              '  assert.ok(middle > 0 && middle < 1);',
              '  assert.equal(atmosphereOuterShellFade(1), 0);',
              '  assert.equal(atmosphereOuterShellFade(2), 0);',
              '});',
              '',
              'test("surface composite gain crosses the physical limb continuously", () => {',
              '  assert.equal(atmosphereSurfaceCompositeBlend(-2, true), 1);',
              '  const inner = atmosphereSurfaceCompositeBlend(-0.4, true);',
              '  const nearLimb = atmosphereSurfaceCompositeBlend(-0.05, true);',
              '  const exterior = atmosphereSurfaceCompositeBlend(0.4, false);',
              '  assert.ok(inner > nearLimb);',
              '  assert.ok(nearLimb > exterior);',
              '  assert.ok(exterior > 0 && exterior < 1);',
              '  assert.equal(atmosphereSurfaceCompositeBlend(0.8, false), 0);',
              '  assert.equal(atmosphereSurfaceCompositeBlend(-2, false), 0);',
              '});',
          ])
          test_path.write_text(tests[:start] + replacement_tests + "\n")

          replace_once(
              "docs/19-celestial-appearance-atmospheres-and-lighting.md",
              "- bright limb/horizon glow from longer optical path length;",
              "- broad limb/horizon glow from longer optical path length, with presentation-domain soft-knee compression and a continuous disk-to-shell gain handoff so the finite shell does not appear as a narrow circular wire rim;",
          )
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm --filter orbit-engine-three test
      - run: pnpm --filter orbit-engine-solar-system-demo test:unit
      - run: pnpm build:wasm
      - run: pnpm demo:build
      - run: git diff --check
      - name: Commit validated renderer change
        shell: bash
        run: |
          git rm .github/workflows/apply-atmosphere-soft-limb-v4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/orbit-engine-three/src/view.ts packages/orbit-engine-three/src/presentation/atmosphere-math.ts packages/orbit-engine-three/tests/atmosphere-math.test.mjs apps/solar-system-demo/src/rendering/three-shell.ts apps/solar-system-demo/src/ui/lighting-inspector.ts docs/19-celestial-appearance-atmospheres-and-lighting.md
          git commit -m 'fix: remove hard atmosphere silhouette ring'
          git push origin HEAD:fix/244-atmosphere-radiance
