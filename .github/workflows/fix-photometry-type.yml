name: Fix photometry tuple typing
on:
  push:
    branches: [fix/244-atmosphere-radiance]
permissions:
  contents: write
env:
  PNPM_VERSION: 11.4.0
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/244-atmosphere-radiance
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fix RGB tuple typing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/solar-system-demo/tests/planet-photometry.smoke.spec.ts')
          text = path.read_text()
          old = '    const background = [0, 0, 0];\n'
          new = '    const background: [number, number, number] = [0, 0, 0];\n'
          if old not in text:
              raise SystemExit('photometry background anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm --filter orbit-engine-solar-system-demo test:unit
      - run: git diff --check
      - name: Commit validated test fix
        run: |
          git rm .github/workflows/fix-photometry-type.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/solar-system-demo/tests/planet-photometry.smoke.spec.ts
          git commit -m 'test: type photometry background as rgb tuple'
          git push origin HEAD:fix/244-atmosphere-radiance
