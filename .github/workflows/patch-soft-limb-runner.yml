name: Patch soft-limb validation runner
on:
  push:
    branches: [fix/244-atmosphere-radiance]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/244-atmosphere-radiance
          fetch-depth: 0
      - name: Add WASM build prerequisite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-atmosphere-soft-limb-v3.yml')
          text = path.read_text()
          old = '      - run: pnpm demo:build\n'
          new = '      - run: pnpm build:wasm\n      - run: pnpm demo:build\n'
          if old not in text:
              raise SystemExit('demo build step anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit runner correction
        shell: bash
        run: |
          git rm .github/workflows/patch-soft-limb-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-atmosphere-soft-limb-v3.yml
          git commit -m 'chore: validate soft limb with wasm build'
          git push origin HEAD:fix/244-atmosphere-radiance
