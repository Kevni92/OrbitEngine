name: Apply validated atmosphere softening
on:
  push:
    branches: [fix/244-atmosphere-radiance]
permissions:
  contents: write
env:
  PNPM_VERSION: 11.4.0
jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/244-atmosphere-radiance
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply soft limb patch
        run: |
          echo '' | base64 -d > /tmp/apply-softening.py
          python /tmp/apply-softening.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter orbit-engine-three test
      - run: pnpm demo:build
      - run: git diff --check
      - name: Commit patch
        run: |
          git rm .github/workflows/apply-atmosphere-softening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/orbit-engine-three/src/view.ts packages/orbit-engine-three/src/presentation/atmosphere-math.ts packages/orbit-engine-three/tests/atmosphere-math.test.mjs docs/19-celestial-appearance-atmospheres-and-lighting.md
          git commit -m 'fix: soften atmosphere limb transition'
          git push origin HEAD:fix/244-atmosphere-radiance
